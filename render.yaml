# Render Blueprint — deploys frontend (static) + backend (API/WhatsApp) as ONE web service.
# In Render: New → Blueprint → select this GitHub repo. It's all configured here.
services:
  - type: web
    name: crisp-and-cloud
    runtime: node
    # puppeteer's postinstall downloads chrome + chrome-headless-shell, and the
    # headless-shell download fails on Render. The app only uses full chrome
    # (headless: true), so skip the postinstall, install just chrome, and retry
    # once after clearing a corrupt browser cache.
    buildCommand: >-
      PUPPETEER_SKIP_DOWNLOAD=true npm install
      && (npx puppeteer browsers install chrome
      || (rm -rf /opt/render/.cache/puppeteer && npx puppeteer browsers install chrome))
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: OWNER_NUMBER
        value: "919058767686"   # change to your number (with country code)
